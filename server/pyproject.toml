[project]
name = "wow-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents show things in World of Warcraft via the WowMCP addon"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
wow-mcp = "wow_mcp.server:main"
wow-mcp-install = "wow_mcp.install:main"
wow-mcp-bridge = "wow_mcp.bridge:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Each test installs the addon (thousands of tiny files); /tmp is a tmpfs that runs out of
# inodes when several runs keep theirs. This folder is cleared at the start of every run.
addopts = "--basetemp=.pytest-tmp"
